---
layout: default
---
<div class="post project-page">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}<p class="post-subtitle">{{ page.description }}</p>{% endif %}
  </header>
  <article class="post-content">
    {{ content }}
  </article>
</div>
