<header class="site-header">
  <div class="container">
    <nav class="site-nav">
      <a class="brand" href="{{ site.baseurl }}/">tiofih<span class="brand-dot">.</span></a>
      <div class="nav-links">
        <a class="page-link" href="{{ site.baseurl }}/">home</a>
        {% for page in site.pages %}
          {% if page.title %}
          <a class="page-link" href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>
          {% endif %}
        {% endfor %}
      </div>
    </nav>
  </div>
</header>
